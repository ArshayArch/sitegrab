# Render Blueprint for SiteGrab.
# Deploy by pushing this repo to GitHub, then in the Render dashboard:
#   New +  ->  Blueprint  ->  pick this repository.
# Render reads this file, builds the Docker image and starts the web service.
services:
  - type: web
    name: sitegrab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    # Render injects PORT automatically; the Dockerfile CMD reads it.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # Required for the /brief design-brief endpoint (Anthropic Claude API).
      # sync: false keeps the secret OUT of this repo — Render prompts for it on
      # first deploy and you set it in the dashboard (Environment tab). The rest
      # of the app (/generate) runs fine without it; only briefs need it.
      - key: ANTHROPIC_API_KEY
        sync: false
